# Generates SearchApp.xcodeproj. Run `xcodegen` from this folder after changing it.
name: SearchApp
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  SearchKit:
    path: Packages/SearchKit
targets:
  SearchApp:
    type: application
    platform: iOS
    sources:
      - SearchApp
    dependencies:
      - package: SearchKit
        product: Domain
      - package: SearchKit
        product: Data
      - package: SearchKit
        product: Presentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SearchApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - package: SearchKit/DomainTests
        - package: SearchKit/DataTests
        - package: SearchKit/PresentationTests
